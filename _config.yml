# Site Info
title: "Alex Snow"
tagline: "Notes · Projects · Talks"
description: 'Notes on tech, life, art & culture By <a href="https://github.com/alexsnow348" target="_blank">Alex Snow</a>.'
baseurl: ""
url: "https://alexsnow348.github.io"
logo: "/public/logo.png"
image: "/public/logo.png"

# Site configurations
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-font-awesome-sass

markdown: kramdown
kramdown:
  input: GFM
excerpt_separator: "<!-- more -->"
sass:
  style: compressed
  sass_dir: _scss
permalink: pretty
categories:
tag:

# Keep unpublished draft posts out of the production build
# NOTE: setting `exclude` here overrides Jekyll's built-in defaults,
# so we must re-list them alongside drafts/.
exclude:
  - drafts/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - "*.gemspec"
  - "*.gem"

# About/contact
author:
  name: "Alex Snow"
  description: <strong>AI Solution Architect</strong> based in Germany.
  gravatar: a320402fa9d8fb397013d6f56da76b97

# Navigation (2nd level links supported)
nav:
  Home:
    - "/"
  Blog:
    - "/blog/"
  Projects:
    - "/projects/"
  Talks:
    - "/talks/"
  Certifications:
    - "/own-certifications/index.html"
  RSS:
    - "/atom.xml"

# Where are tags and categories displayed
tag_page: "/blog/alexsnowschool/"
category_page: "/blog/fyby/"

# Plugins
mathjax: true
google_analytics_token: "UA-167038249-1"
disqus_short_name:
